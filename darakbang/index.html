<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="다락방">
  <title>박준원 다락방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 8c2 6 4 8 10 12 8 6 12 14 12 22 0 12-10 18-22 18S10 54 10 42c0-8 4-16 12-22 6-4 8-6 10-12z' fill='%236B2D5C'/%3E%3C/svg%3E">
</head>
<body>

<!-- 무화과 로고 (재사용) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="fig-logo" viewBox="0 0 64 64">
      <path d="M32 8c2 6 4 8 10 12 8 6 12 14 12 22 0 12-10 18-22 18S10 54 10 42c0-8 4-16 12-22 6-4 8-6 10-12z" fill="#6B2D5C"/>
      <path d="M32 22c7 0 14 8 14 18 0 7-6 12-14 12S18 47 18 40c0-10 7-18 14-18z" fill="#D98E9A"/>
      <path d="M32 29c4 0 8 5 8 11 0 4-3 7-8 7s-8-3-8-7c0-6 4-11 8-11z" fill="#F5E1E4"/>
      <g fill="#6B2D5C">
        <circle cx="28" cy="36" r="1.1"/><circle cx="36" cy="36" r="1.1"/><circle cx="32" cy="41" r="1.1"/>
        <circle cx="29" cy="43" r="1"/><circle cx="35" cy="43" r="1"/><circle cx="32" cy="33" r="1"/>
      </g>
      <path d="M32 8c-3-3-8-4-12-2 3 1 5 3 7 6" fill="#5B7A4E"/>
    </symbol>
  </defs>
</svg>

<div id="loading"></div>

<!-- 입장 화면 -->
<section id="login">
  <svg class="logo"><use href="#fig-logo"/></svg>
  <div class="group" id="login-group"></div>
  <h1 id="login-room"></h1>
  <form id="login-form" autocomplete="off">
    <input type="password" id="login-pw" placeholder="비밀번호" inputmode="text" autocapitalize="off">
    <button type="submit">들어가기</button>
    <div class="error" id="login-error"></div>
  </form>
  <div class="preview-note hidden" id="login-preview-note">미리보기 모드입니다. 아무 비밀번호나 입력하면 들어갈 수 있고,<br>저장한 내용은 이 기기에만 남습니다.</div>
</section>

<!-- 앱 -->
<div id="app" class="hidden">
  <div class="preview-banner hidden" id="preview-banner">미리보기 모드 · config.js에 API_URL을 넣으면 실제 시트와 연결됩니다</div>
  <header class="top">
    <svg class="logo"><use href="#fig-logo"/></svg>
    <div class="titles">
      <div class="group" id="hdr-group"></div>
      <div class="room" id="hdr-room"></div>
    </div>
    <button class="icon-btn" id="btn-refresh" title="새로고침" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-logout" title="나가기" aria-label="나가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <button id="fab" class="hidden" aria-label="작성">+</button>

  <nav class="tabbar">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
    <a href="#notice" data-tab="notice">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h3l6 4V5L7 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>공지</a>
    <a href="#resolve" data-tab="resolve">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>결단</a>
    <a href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</a>
    <a href="#prayer" data-tab="prayer">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>기도</a>
    <a href="#snack" data-tab="snack">
      <svg viewBox="0 0 24 24"><path d="M4 11h16l-1.5 8h-13z"/><path d="M6 11a6 6 0 0 1 12 0"/><path d="M12 3v2"/></svg>간식</a>
  </nav>
</div>

<!-- 바텀 시트 -->
<div id="sheet-wrap" class="hidden">
  <div id="sheet-backdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <h2 id="sheet-title"></h2>
    <form id="sheet-form" autocomplete="off"></form>
    <div class="form-error" id="sheet-error"></div>
    <div class="sheet-actions">
      <button type="button" class="cancel" id="sheet-cancel">취소</button>
      <button type="button" class="save" id="sheet-save">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
